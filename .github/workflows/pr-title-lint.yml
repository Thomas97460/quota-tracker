name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  statuses: write

jobs:
  # ── enforce Conventional Commits on the PR title ─────────────────────────────
  # Required because the repo squash-merges: the PR title becomes the single
  # commit message on main, which release-please then parses to decide the next
  # version and changelog section.
  lint-pr-title:
    name: lint-pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            chore
            ci
            test
            build
            revert
          requireScope: false
