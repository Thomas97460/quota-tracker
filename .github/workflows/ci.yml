name: CI

on:
  push:
    branches: ["main"]
    tags-ignore: ["v*"]
    paths-ignore:
      - "assets/**"
  pull_request:

permissions:
  contents: write

jobs:
  # ── ruff lint + format ────────────────────────────────────────────────────────
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: lint
        run: uv run ruff check .
      - name: format check
        run: uv run ruff format --check .

  # ── mypy strict ───────────────────────────────────────────────────────────────
  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run mypy

  # ── interrogate docstring coverage ────────────────────────────────────────────
  docstrings:
    name: interrogate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run interrogate -v quota_tracker

  # ── pytest + coverage ─────────────────────────────────────────────────────────
  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: run tests
        run: uv run pytest --cov-report=xml --cov-report=term
      - name: upload coverage xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 1

  # ── frontend build ────────────────────────────────────────────────────────────
  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build

  # ── build & smoke-test the packaged binary (integration gate) ─────────────────
  # Builds the real release artifact and exercises it, so a broken PyInstaller
  # package or frontend-embedding issue is caught on every PR/main push instead
  # of only being discovered when release.yml runs at tag time.
  integration-smoke:
    name: integration smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --extra dev
      - name: build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: build binary
        run: |
          env -u PYTHONPATH uv run pyinstaller \
            --noconfirm \
            --onefile \
            --name quota-tracker \
            --add-data "frontend/dist:frontend/dist" \
            --copy-metadata quota-tracker \
            quota_tracker/cli.py
      - name: version smoke test
        run: dist/quota-tracker --version
      - name: api smoke test
        run: |
          export HOME="${RUNNER_TEMP}/qt-home"
          mkdir -p "${HOME}"
          dist/quota-tracker serve --host 127.0.0.1 --port 8787 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          ok=""
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/api/health -o /tmp/health.json; then
              ok=1
              break
            fi
            sleep 0.5
          done
          cat /tmp/health.json
          [ -n "$ok" ] || { echo "quota-tracker serve never became healthy"; exit 1; }
          python3 -c "import json; json.load(open('/tmp/health.json'))"

  # ── update coverage badge (main branch only) ──────────────────────────────────
  # main is protected with no bypass, so this can no longer push straight to
  # main: it opens a small PR and lets it auto-merge once required checks pass.
  update-badges:
    name: update badges
    needs: [lint, typecheck, docstrings, tests, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-xml
      - name: generate coverage badge json
        run: |
          COVERAGE=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          print(round(float(root.attrib['line-rate']) * 100))
          ")
          if   [ "$COVERAGE" -ge 90 ]; then COLOR="00d7d7"
          elif [ "$COVERAGE" -ge 75 ]; then COLOR="f5a623"
          else COLOR="e05252"; fi
          mkdir -p assets
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s","style":"flat-square"}' \
            "$COVERAGE" "$COLOR" > assets/coverage.json
          echo "coverage: ${COVERAGE}%"
      - name: open badge PR if changed
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update coverage badge"
          title: "chore: update coverage badge"
          body: "Automated coverage badge refresh."
          branch: chore/update-coverage-badge
          delete-branch: true
          add-paths: assets/coverage.json

      - name: enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}"
